# pnpm 11 ignores pnpm.onlyBuiltDependencies in package.json and fails the
# install until every package with a build script is listed here. esbuild is
# fetched by tsup and vitest; lefthook installs the git hooks. next-intl, a
# dev dependency for the compatibility test only, pulls in @parcel/watcher and
# @swc/core for its message extractor, which the test never runs.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  lefthook: true
